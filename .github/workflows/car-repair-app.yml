name: Car Repair App (Flutter)

on:
  push:
    paths:
      - 'car_repair_app/**'
      - '.github/workflows/car-repair-app.yml'

permissions:
  contents: read
  checks: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Helper
        run: |
          cat > "$RUNNER_TEMP/post.py" <<'PY'
          import json, subprocess, sys, os, base64
          name, path, mode = sys.argv[1], sys.argv[2], sys.argv[3]
          data = open(path, 'rb').read()
          text = base64.b64encode(data).decode() if mode == 'b64' else data.decode('utf-8', 'replace')
          size = 60000
          chunks = [text[i:i+size] for i in range(0, len(text), size)] or ['']
          for i, c in enumerate(chunks):
              body = {'name': '%s-%03d-of-%03d' % (name, i, len(chunks)), 'head_sha': os.environ['GITHUB_SHA'],
                      'status': 'completed', 'conclusion': 'neutral',
                      'output': {'title': name, 'summary': mode, 'text': c}}
              open('body.json', 'w').write(json.dumps(body))
              subprocess.run(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/check-runs', '--input', 'body.json', '--jq', '.id'], check=True)
          PY
      - name: Versions, pub get, analyze
        working-directory: car_repair_app
        run: |
          {
            flutter --version
            flutter pub get
            flutter analyze || true
          } > "$RUNNER_TEMP/analyze.log" 2>&1 || true
          tail -c 50000 "$RUNNER_TEMP/analyze.log" > "$RUNNER_TEMP/analyze.tail"
          python3 "$RUNNER_TEMP/post.py" xfer-analyze "$RUNNER_TEMP/analyze.tail" text
      - name: Record fixtures from the live vPIC API
        working-directory: car_repair_app
        run: |
          dart run tool/record_fixtures.dart "$RUNNER_TEMP/fixtures" > "$RUNNER_TEMP/record.log" 2>&1 || true
          cat "$RUNNER_TEMP/record.log"
          python3 "$RUNNER_TEMP/post.py" xfer-record-log "$RUNNER_TEMP/record.log" text
          tar czf "$RUNNER_TEMP/fixtures.tgz" -C "$RUNNER_TEMP/fixtures" .
          python3 "$RUNNER_TEMP/post.py" xfer-fixtures "$RUNNER_TEMP/fixtures.tgz" b64
      - name: Generate platform scaffolding
        run: |
          mkdir "$RUNNER_TEMP/scaffold" && cd "$RUNNER_TEMP/scaffold"
          flutter create --platforms=android,ios --org com.example --project-name car_repair_app car_repair_app > create.log 2>&1 || true
          tail -30 create.log
          cd car_repair_app
          tar czf "$RUNNER_TEMP/scaffold.tgz" android ios .metadata .gitignore pubspec.yaml analysis_options.yaml
          ls -l "$RUNNER_TEMP/scaffold.tgz"
          python3 "$RUNNER_TEMP/post.py" xfer-scaffold "$RUNNER_TEMP/scaffold.tgz" b64
