name: Car Repair App (Flutter)

# Runs only when the Flutter app (or this workflow) changes.
on:
  push:
    paths:
      - 'car_repair_app/**'
      - '.github/workflows/car-repair-app.yml'
  pull_request:
    paths:
      - 'car_repair_app/**'
      - '.github/workflows/car-repair-app.yml'

permissions:
  contents: read
  checks: write

defaults:
  run:
    shell: bash
    working-directory: car_repair_app

jobs:
  test:
    name: Analyze, offline tests, live vPIC tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versions and dependencies
        id: setup
        run: |
          flutter --version 2>&1 | tee "$RUNNER_TEMP/setup.log"
          flutter pub get 2>&1 | tee -a "$RUNNER_TEMP/setup.log"
      - name: Static analysis
        id: analyze
        if: ${{ !cancelled() }}
        run: flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze.log"
      - name: Offline tests (recorded real vPIC responses)
        id: offline
        if: ${{ !cancelled() }}
        run: flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/offline.log"
      - name: Live tests (real NHTSA vPIC API)
        id: live
        if: ${{ !cancelled() }}
        run: flutter test test_live --reporter expanded 2>&1 | tee "$RUNNER_TEMP/live.log"
      - name: Publish test report
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tool/ci_report.py "Car Repair App test report" \
            "Setup=${{ steps.setup.outcome }}=$RUNNER_TEMP/setup.log" \
            "Static analysis=${{ steps.analyze.outcome }}=$RUNNER_TEMP/analyze.log" \
            "Offline tests=${{ steps.offline.outcome }}=$RUNNER_TEMP/offline.log" \
            "Live vPIC tests=${{ steps.live.outcome }}=$RUNNER_TEMP/live.log"

  android:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        id: build
        run: |
          flutter pub get
          flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/apk.log"
          ls -l build/app/outputs/flutter-apk/ | tee -a "$RUNNER_TEMP/apk.log"
      - uses: actions/upload-artifact@v4
        with:
          name: car-repair-app-debug-apk
          path: car_repair_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Publish build report
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tool/ci_report.py "Car Repair App Android build report" \
            "Android debug APK=${{ steps.build.outcome }}=$RUNNER_TEMP/apk.log"

  screenshots:
    name: Render screenshots (recorded vPIC data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Find a font with Arabic glyphs
        run: |
          pick() {
            fc-list :lang=ar file | sed 's/: *$//' | grep -iE '\.(ttf|otf)$' \
              | grep -iE 'NotoSansArabic|NotoNaskhArabic|DejaVuSans\.ttf|Amiri|Kacst' | sort | head -1
          }
          font="$(pick || true)"
          if [ -z "$font" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core
            font="$(pick || true)"
          fi
          echo "Arabic font: $font"
          echo "SCREENSHOT_ARABIC_FONT=$font" >> "$GITHUB_ENV"
      - name: Render
        id: render
        run: |
          export FLUTTER_ROOT="${FLUTTER_ROOT:-$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")}"
          flutter pub get
          flutter test test_screenshots --reporter expanded 2>&1 | tee "$RUNNER_TEMP/screenshots.log"
          ls -l build/screenshots | tee -a "$RUNNER_TEMP/screenshots.log"
      - uses: actions/upload-artifact@v4
        with:
          name: car-repair-app-screenshots
          path: car_repair_app/build/screenshots/*.png
          if-no-files-found: error
      - name: Publish render report
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tool/ci_report.py "Car Repair App screenshot report" \
            "Screenshots=${{ steps.render.outcome }}=$RUNNER_TEMP/screenshots.log"
      - name: TEMP transfer
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf "$RUNNER_TEMP/shots.tgz" -C build/screenshots . || exit 0
          base64 -w0 "$RUNNER_TEMP/shots.tgz" > shots.b64
          split -b 60000 -d -a 3 shots.b64 chunk_
          n=$(ls chunk_* | wc -l)
          for c in chunk_*; do
            i=${c#chunk_}
            python3 -c "import json;print(json.dumps({'name':'xfer-shots-$i-of-$n','head_sha':'$GITHUB_SHA','status':'completed','conclusion':'neutral','output':{'title':'xfer','summary':'b64','text':open('$c').read()}}))" > body.json
            gh api "repos/$GITHUB_REPOSITORY/check-runs" --input body.json --jq '.id' > /dev/null
          done
          rm -f chunk_* shots.b64 body.json
